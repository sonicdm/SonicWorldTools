# ==========================================
# DragNBuild - Vanilla Valheim Pieces Config
# Valid Directions: UpDown, ForwardBackward, LeftRight
# SonicWorldTools reads Directions and Dimensions to infer the prefab's repeat axis and spacing.
# Optional per-piece fields:
#   Axis: Auto | X | Z | Vertical
#   ShapeSpacing: center-to-center meters (overrides Dimensions/bounds)
#   Dimensions.BottomOffset: DragNBuild-compatible bottom offset
#   ShapeYawOffset: local yaw correction in degrees, applied after the axis mapping
#   TangentYawOffset: extra local yaw correction for GroundProp tangent-facing repeats
#   ShapeCenterOffset: local x,y,z from prefab origin to the repeat-line center
#   ShapeBottomOffset: local vertical offset from prefab origin to its ground-contact plane
#   ShapeAnchor: Root | SnapCenter (Root is the DragNBuild-compatible default)
# This file is embedded in the DLL and copied to the profile config folder on first run.
# The plugin does not derive it from prefab data or overwrite an existing profile copy.
# ==========================================

