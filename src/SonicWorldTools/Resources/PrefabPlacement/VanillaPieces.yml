# Sonic World Tools Piece Repeater prefab catalog (source of truth).
# This file is embedded in SonicWorldTools.dll and copied to each profile on first run.
# Edit profiles here for release defaults; the runtime profile copy may append pieces
# discovered from mods installed in that game profile and is not the source catalog.
# ProfileType is editable per piece: EdgeChain (requires ShapeAxis + JoinStart/JoinEnd)
# or GroundProp (uses DefaultSpacing or the shared setting and follows terrain).
# Enabled: false opts a profiled piece out; missing Enabled defaults to true.
# Status: NeedsReview still blocks use until the geometry profile is verified.
# ShapeJoinStartOffset / ShapeJoinEndOffset are local XYZ corrections to each
# join point. Editing either re-solves the repeat chain from its anchored first piece.
# ShapePositionOffset instead applies the same local root correction to each piece.

