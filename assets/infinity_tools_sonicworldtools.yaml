hammer:
- name: Precision Select
  description: Click three corners to select. Alt+LMB adds; Alt+MMB excludes. Shift+MMB copies; Ctrl+Del dismantles; Shift+Del deletes.
  icon: Hammer
  instant: true
  command: sonic_precision_pipette
  tabIndex: 0
- name: Line Tool
  description: MMB samples; LMB adds waypoints; Shift+LMB places. Q/E cycles first-piece snap. Right Alt+LMB snaps to a joint; Right Alt+MMB traces a wall; Shift+MMB adds the next row. Wheel rotates; Left Alt+wheel changes gap; hold Left Alt for level. F7 settings, including world direction snap; Shift+F7 offsets; Esc exits.
  icon: Hammer
  instant: true
  command: sonic_piece_repeater
  tabIndex: 0
- name: Shape Tool
  description: MMB samples a piece. Click a center and move to size; cursor direction also sets square angle. I cycles outline, grid and concentric infill; Shift+wheel changes concentric spacing; Shift+click places. Q cycles circle, square and rectangle.
  icon: Hammer
  instant: false
  command: sonic_shape_tool
  tabIndex: 0
hoe:
- name: Lower Terrain
  description: Lowers terrain by the selected amount. Hold <mod1> to smooth; hold <mod2> for free placement.
  icon: raise
  command: terrain lower=<h> smooth=<mod1>?.5:0 <area>
  initialHeight: 0.2
  terrainGrid: -<mod2>
  snapGround: true
  tabIndex: 0
- name: Grass Path
  description: Click route points. Hold <mod2> to finish; also hold <mod1> on the final point for softer edges. Scroll to change half-width.
  icon: replant
  command: terrain curve paint=grass level smooth=<mod1>?.5:0 circle=<r> p=<p*>
  initialSize: 2
  finish: <mod2>
  terrainGrid: true
  snapGround: true
  tabIndex: 0
