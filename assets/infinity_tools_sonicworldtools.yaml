hammer:
- name: Precision Select
  description: A→B→C box. Alt+LMB/MMB refine, Shift+MMB copy, Ctrl+Del dismantle, Shift+Del delete.
  icon: Hammer
  instant: true
  command: sonic_precision_pipette
  tabIndex: 0
- name: Piece Repeater
  description: MMB samples; click waypoints; Ctrl+click places. Q/E cycle build snap points; Right Alt+click snaps a waypoint to a piece joint. Wheel rotates repeated pieces in place; Alt+wheel adjusts the gap. Profiles follow build-piece surfaces or terrain; props face the tangent. F7 sets interpolation, smoothing, gap and height. Esc exits.
  icon: Hammer
  instant: true
  command: sonic_piece_repeater
  tabIndex: 0
hoe:
- name: Lower Terrain
  description: Lowers terrain by the selected amount. Hold <mod1> to smooth; hold <mod2> for free placement.
  icon: raise
  command: terrain lower=<h> smooth=<mod1>?.5:0 <area>
  initialHeight: 0.2
  terrainGrid: -<mod2>
  snapGround: true
  tabIndex: 0
- name: Grass Path
  description: Click route points. Hold <mod2> to finish; also hold <mod1> on the final point for softer edges. Scroll to change half-width.
  icon: replant
  command: terrain curve paint=grass level smooth=<mod1>?.5:0 circle=<r> p=<p*>
  initialSize: 2
  finish: <mod2>
  terrainGrid: true
  snapGround: true
